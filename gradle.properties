# Gradle properties for Java 21
org.gradle.java.home=/Users/Artur/Library/Java/JavaVirtualMachines/corretto-21.0.6/Contents/Home

# Performance optimizations
org.gradle.parallel=true
org.gradle.caching=true
# org.gradle.configuration-cache=true

# Memory settings
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError

# Android specific
android.useAndroidX=true
android.enableJetifier=true
android.suppressUnsupportedCompileSdk=35

# Native build optimizations
android.enableR8.fullMode=true

# Поддержка страниц памяти 16 КБ (Android 15 требование)
# Эти настройки обеспечивают совместимость с устройствами, использующими 16 КБ страницы памяти
android.enableMemoryOptimization=true
android.enablePageSizeOptimization=true
android.memoryPageSize=16384

# Оптимизация нативной сборки с поддержкой 16KB страниц
android.enableNativeBuildCache=true
android.enableNativeBuildOptimization=true
